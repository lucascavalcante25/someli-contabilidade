# Deploy automático da API Someli na Contabo (mesma VPS do Semear, porta 8081).
#
# Secrets no GitHub (pode reutilizar os do Semear):
#   CONTABO_HOST, CONTABO_USER, CONTABO_SSH_KEY
#
# Não usa git pull na VPS (repo privado → falhava sem credencial HTTPS).
# O runner faz checkout e envia o código via SCP.

name: Deploy Contabo API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/contabo/**"
      - ".github/workflows/deploy-contabo.yml"
  workflow_dispatch:

concurrency:
  group: deploy-someli-contabo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Empacotar backend + deploy
        run: |
          tar -czf someli-deploy.tgz backend deploy/contabo

      - name: Enviar pacote para a Contabo
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: 22
          source: "someli-deploy.tgz"
          target: "/tmp"

      - name: Extrair e rebuild da API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            test -f /tmp/someli-deploy.tgz
            # Preserva .env e volumes; só atualiza código
            mkdir -p /opt/someli-contabilidade
            tar -xzf /tmp/someli-deploy.tgz -C /opt/someli-contabilidade
            rm -f /tmp/someli-deploy.tgz
            cd /opt/someli-contabilidade/deploy/contabo
            test -f .env
            docker compose --env-file .env up -d --build api
            echo "Aguardando API ficar UP..."
            ok=0
            for i in $(seq 1 36); do
              if curl -sf http://127.0.0.1:8081/management/health | grep -q '"status":"UP"'; then
                echo "Health OK (tentativa $i)"
                ok=1
                break
              fi
              echo "  tentativa $i/36 — ainda subindo..."
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "API não respondeu UP a tempo. Últimos logs:"
              docker compose logs api --tail 80
              exit 1
            fi
            echo "Deploy Someli Contabo OK"
