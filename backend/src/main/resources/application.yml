server:
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/someliContab}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

management:
  endpoints:
    web:
      base-path: /management
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: DEBUG

app:
  upload:
    base-path: ${UPLOAD_PATH:./data/uploads}
  certificados:
    # 32 bytes em Base64 (openssl rand -base64 32). Sem valor: envio de certificado A1 fica desligado.
    chave-mestra: ${CERTIFICADO_CHAVE_MESTRA:}
  jwt:
    secret: ${JWT_SECRET:ZmFrZV9zdXBlcl9zZWNyZXRfZmFrZV9zdXBlcl9zZWNyZXRfZmFrZV9zdXBlcl9zZWNyZXQ=}
    expiration-hours: ${JWT_EXPIRATION_HOURS:72}
  tags:
    # NOVO_CLIENTE some após N dias desde data_inicio_cobranca (fallback: data_criacao)
    novo-cliente-dias: ${TAG_NOVO_CLIENTE_DIAS:90}
    # Alternativa: some após N competências cobradas (0 = desliga essa regra; dias prevalece se ambos)
    novo-cliente-competencias: ${TAG_NOVO_CLIENTE_COMPETENCIAS:3}

nfse:
  adn:
    # Distribuição de NFS-e do Portal Nacional. Produção restrita: https://adn.producaorestrita.nfse.gov.br
    base-url: ${NFSE_ADN_BASE_URL:https://adn.nfse.gov.br}
    # Job de hora em hora (desligado por padrão; a busca manual pela tela funciona mesmo desligado).
    agendamento-ativo: ${NFSE_ADN_AGENDAMENTO:false}
    cron: ${NFSE_ADN_CRON:0 17 * * * *}

integra-contador:
  enabled: false
  consumer-key: ${INTEGRA_CONSUMER_KEY:}
  consumer-secret: ${INTEGRA_CONSUMER_SECRET:}

receitaws:
  api:
    url: ${RECEITAWS_API_URL:https://www.receitaws.com.br/v1/cnpj/}

cnpjws:
  api:
    url: ${CNPJWS_API_URL:https://publica.cnpj.ws/cnpj/}

infosimples:
  # Desligado: conta InfoSimples bloqueada. Religar com INFOSIMPLES_ENABLED=true e INFOSIMPLES_TOKEN.
  enabled: ${INFOSIMPLES_ENABLED:false}
  token: ${INFOSIMPLES_TOKEN:}
  api:
    url: ${INFOSIMPLES_API_URL:https://api.infosimples.com/api/v2/consultas/sintegra/unificada}
